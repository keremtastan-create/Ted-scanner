name: TED Gold Scanner

on:
  schedule:
    - cron: "30 5 * * *"   # her gün 05:30 UTC (İstanbul 08:30)
  workflow_dispatch: {}      # elle de tetiklenebilir (Actions sekmesinden "Run workflow")

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run scanner
        run: python scanner.py

      - name: Commit results
        run: |
          git config user.name "ted-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git push
